# Firebase App Hosting configuration for ResellerOS production.
#
# Reference: https://firebase.google.com/docs/app-hosting/configure
#
# App Hosting wraps Cloud Run + Cloud Build behind a managed Firebase
# experience. This file is read on deploy to size the underlying Cloud Run
# service and inject build-time / runtime secrets.
#
# Secrets are NOT stored here. They live in Google Secret Manager and are
# referenced by name (e.g., SUPABASE_SERVICE_ROLE_KEY). Set them via:
#
#   firebase apphosting:secrets:set <NAME>
#   firebase apphosting:secrets:grantaccess <NAME> --backend <BACKEND_ID>
#
# Public env vars (prefixed NEXT_PUBLIC_*) are baked into the client bundle
# at build time, so they MUST be available during build. They're listed
# here under env.

runConfig:
  # Cloud Run sizing — start small, scale as traffic grows. Indian SME
  # reseller workload is light (a few users per tenant, mostly read-heavy).
  minInstances: 0       # cold-start tolerated for cost; bump to 1 once we have customers
  maxInstances: 10      # protects against runaway spend
  concurrency: 80       # Next.js handles ~80 concurrent requests per instance comfortably
  cpu: 1
  memoryMiB: 512

  # Daily renewal cron secret (CRITICAL — without this the cron route
  # accepts unauthenticated requests in production)
  # Cloud Scheduler will hit /api/cron/renewals with: Authorization: Bearer $CRON_SECRET
  # See migration from vercel.json cron documented in CLAUDE.md.

env:
  # ── Public — baked at build time ────────────────────────────────────
  - variable: NEXT_PUBLIC_SUPABASE_URL
    secret: NEXT_PUBLIC_SUPABASE_URL
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_URL
    secret: NEXT_PUBLIC_APP_URL
    availability:
      - BUILD
      - RUNTIME

  # ── Server-side — runtime only ──────────────────────────────────────
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - RUNTIME

  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME

  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME

  - variable: RESEND_FROM_DEFAULT
    secret: RESEND_FROM_DEFAULT
    availability:
      - RUNTIME
